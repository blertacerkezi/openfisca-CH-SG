# Anspruchsprüfung KiBG — TDD-Vertrag für CS1.
# Ablage im Repo: openfisca_ch_sg/tests/kibg_eligibility.yaml
#
# Output, den CS2 konsumiert:
#   kibg_anspruchsberechtigt (Person, MONTH, bool)
#   true nur für das betreute Kind. Eltern und Partner sind false.
#   Einkommen, Vermögen und Beitragshöhe sind hier absichtlich nicht geprüft.
#
# Inputs (alle Person, MONTH). Nicht gesetzte Bools = false, Pensum = 0.
#   wohnsitz_im_kanton                     bool   Art. 4 Abs. 1 KiBG
#   erziehungsberechtigt                   bool   nur diese Erwachsenen zählen
#   beschaeftigungsgrad                    float  Prozent; 20 bedeutet 20 Prozent
#   berufliche_integration                 bool   Art. 12 Bst. a KiBV
#   familiaere_belastung                   bool   Art. 12 Bst. b KiBV
#   alter_in_monaten                       int    Art. 4 Abs. 3 KiBG
#   primarschule_abgeschlossen             bool   Art. 4 Abs. 3 KiBG
#   faktische_obhut                        bool   Art. 7 KiBV
#   betreuung_in_anspruch                  bool   Art. 7 KiBV
#   betreuung_in_anerkannter_einrichtung   bool   Art. 3 Abs. 1 KiBG
#   kindliche_indikation                   bool   Art. 12 Bst. c KiBV
#
# Annahmen, bis die Law-Leute Entity und Period festlegen:
# - Bestehendes Household, Rollen adults / children. Keine neue Entity.
# - Period MONTH, Tests auf 2026-08 (Gesetz vom 14. Juni 2026).
# - Eine erziehungsberechtigte Person im Haushalt: Pensum wenigstens 20.
# - Zwei oder mehr: Summe wenigstens 120. 120 + 0 erfüllt den Wortlaut.
# - Partner ohne erziehungsberechtigt zählt weder für die 120 noch fürs Wohnsitz-Erfordernis.
# - Ausnahme (eine der drei KiBV-Tatsachen) hebt nur das Pensum auf, nichts anderes.
# - Jede erziehungsberechtigte Person im Haushalt braucht wohnsitz_im_kanton.
# - alter_in_monaten >= 3 und primarschule_abgeschlossen = false.
#   Kein numerisches Höchstalter: massgebend ist der Primarschulabschluss.

- name: Alleinerziehend mit 20 Prozent und Kind ab 3 Monaten ist anspruchsberechtigt
  period: 2026-08
  input:
    persons:
      elternteil:
        wohnsitz_im_kanton: true
        erziehungsberechtigt: true
        beschaeftigungsgrad: 20
      kind:
        alter_in_monaten: 3
        faktische_obhut: true
        betreuung_in_anspruch: true
        betreuung_in_anerkannter_einrichtung: true
    households:
      haushalt:
        adults: [elternteil]
        children: [kind]
  output:
    persons:
      elternteil:
        kibg_anspruchsberechtigt: false
      kind:
        kibg_anspruchsberechtigt: true

